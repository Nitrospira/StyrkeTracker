<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StyrkeTracker">
  <link rel="manifest" href="manifest.json">
  <title>StyrkeTracker</title>
  <style>
    :root { --bg:#f4f6f8; --card:#fff; --text:#111827; --muted:#6b7280; --accent:#111827; --ok:#15803d; --border:#e5e7eb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    header { background:#111827; color:white; padding:calc(18px + env(safe-area-inset-top)) 18px 18px; }
    header h1 { margin:0; font-size:26px; }
    header p { margin:5px 0 0; opacity:.8; font-size:14px; }
    main { max-width:760px; margin:auto; padding:16px 14px calc(30px + env(safe-area-inset-bottom)); }
    .card { background:var(--card); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:0 2px 12px rgba(0,0,0,.05); }
    h2 { font-size:18px; margin:0 0 12px; }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:5px; }
    select,input,button { width:100%; font-size:16px; border-radius:12px; border:1px solid var(--border); padding:12px; background:white; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    button { border:none; font-weight:700; cursor:pointer; }
    .primary { background:#111827; color:white; margin-top:12px; }
    .secondary { background:#eef2f7; color:#111827; }
    .danger { background:#fee2e2; color:#991b1b; }
    .success { color:var(--ok); font-weight:700; margin-top:8px; min-height:20px; }
    .tabs { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px; }
    .tab { padding:10px 5px; background:#e5e7eb; }
    .tab.active { background:#111827; color:white; }
    .view { display:none; }
    .view.active { display:block; }
    .exercise-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); gap:10px; }
    .exercise-row:last-child { border-bottom:none; }
    .exercise-name { font-weight:700; }
    .small { font-size:13px; color:var(--muted); }
    .badge { background:#eef2f7; padding:5px 8px; border-radius:999px; font-size:12px; white-space:nowrap; }
    canvas { width:100%; height:260px; display:block; background:white; border-radius:12px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { text-align:left; padding:10px 6px; border-bottom:1px solid var(--border); }
    th { color:var(--muted); font-size:12px; }
    .note { background:#eff6ff; padding:11px; border-radius:12px; font-size:13px; color:#1e3a8a; }
    .footer-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  </style>
</head>
<body>
<header>
  <h1>StyrkeTracker</h1>
  <p>Registrér vægte og følg dine fremskridt</p>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-view="registrer">Registrér</button>
    <button class="tab" data-view="fremskridt">Fremskridt</button>
    <button class="tab" data-view="historik">Historik</button>
  </div>

  <section id="registrer" class="view active">
    <div class="card">
      <h2>Ny registrering</h2>
      <label>Øvelse</label>
      <select id="exercise"></select>

      <div class="grid3" style="margin-top:10px">
        <div>
          <label>Vægt (kg)</label>
          <input id="weight" type="number" inputmode="decimal" min="0" step="0.5" placeholder="fx 40">
        </div>
        <div>
          <label>Gentagelser</label>
          <input id="reps" type="number" inputmode="numeric" min="1" max="100" value="10">
        </div>
        <div>
          <label>Sæt</label>
          <input id="sets" type="number" inputmode="numeric" min="1" max="10" value="3">
        </div>
      </div>

      <label style="margin-top:10px">Dato</label>
      <input id="date" type="date">

      <button class="primary" id="saveBtn">Gem træning</button>
      <div class="success" id="message"></div>
    </div>

    <div class="card">
      <h2>Dine 7 øvelser</h2>
      <div id="exerciseList"></div>
    </div>
  </section>

  <section id="fremskridt" class="view">
    <div class="card">
      <h2>Udvikling</h2>
      <label>Vælg øvelse</label>
      <select id="chartExercise"></select>
      <div style="height:12px"></div>
      <canvas id="chart" width="700" height="300"></canvas>
      <div class="small" id="chartSummary" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <div class="note">Grafen viser den registrerede træningsvægt. Hvis du vil, kan en senere version også vise estimeret 1RM, samlet træningsvolumen og personlige rekorder.</div>
    </div>
  </section>

  <section id="historik" class="view">
    <div class="card">
      <h2>Seneste træninger</h2>
      <div style="overflow:auto">
        <table>
          <thead><tr><th>Dato</th><th>Øvelse</th><th>Kg</th><th>Sæt × reps</th><th></th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="footer-actions">
        <button class="secondary" id="exportBtn">Eksportér data</button>
        <button class="danger" id="clearBtn">Slet alle data</button>
      </div>
    </div>
  </section>
</main>

<script>
const exercises = [
  "Benpres",
  "Chest press / brystpres",
  "Lat pulldown",
  "Leg curl",
  "Seated row / siddende roning",
  "Shoulder press",
  "Cable crunch"
];

const storageKey = "styrketracker_entries_v1";
let entries = JSON.parse(localStorage.getItem(storageKey) || "[]");

const exercise = document.getElementById("exercise");
const chartExercise = document.getElementById("chartExercise");
const weight = document.getElementById("weight");
const reps = document.getElementById("reps");
const sets = document.getElementById("sets");
const date = document.getElementById("date");
const msg = document.getElementById("message");

function todayLocal() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime()-off*60000).toISOString().slice(0,10);
}
date.value = todayLocal();

function fillSelects() {
  exercises.forEach(x => {
    exercise.add(new Option(x,x));
    chartExercise.add(new Option(x,x));
  });
}
fillSelects();

function save() {
  const w = Number(weight.value);
  const r = Number(reps.value);
  const s = Number(sets.value);
  if (!w || w <= 0 || !r || !s || !date.value) {
    msg.textContent = "Udfyld vægt, reps, sæt og dato.";
    return;
  }
  entries.push({
    id: Date.now(),
    exercise: exercise.value,
    weight: w,
    reps: r,
    sets: s,
    date: date.value
  });
  entries.sort((a,b) => a.date.localeCompare(b.date) || a.id-b.id);
  localStorage.setItem(storageKey, JSON.stringify(entries));
  msg.textContent = "✓ Træningen er gemt";
  weight.value = "";
  renderAll();
  setTimeout(()=>msg.textContent="",1800);
}

function latestFor(ex) {
  return entries.filter(e=>e.exercise===ex).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)[0];
}

function renderExerciseList() {
  const el = document.getElementById("exerciseList");
  el.innerHTML = exercises.map(ex=>{
    const l = latestFor(ex);
    return `<div class="exercise-row">
      <div><div class="exercise-name">${ex}</div><div class="small">${l ? "Sidst: "+formatDate(l.date) : "Ingen registrering endnu"}</div></div>
      <div class="badge">${l ? l.weight+" kg" : "—"}</div>
    </div>`;
  }).join("");
}

function formatDate(s) {
  const [y,m,d] = s.split("-");
  return `${d}.${m}.${y}`;
}

function renderHistory() {
  const body = document.getElementById("historyBody");
  const data = [...entries].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  body.innerHTML = data.length ? data.map(e=>`
    <tr>
      <td>${formatDate(e.date)}</td>
      <td>${e.exercise}</td>
      <td><b>${e.weight}</b></td>
      <td>${e.sets} × ${e.reps}</td>
      <td><button class="danger" style="padding:6px 8px" onclick="removeEntry(${e.id})">×</button></td>
    </tr>`).join("") : `<tr><td colspan="5" class="small">Ingen træninger registreret endnu.</td></tr>`;
}

window.removeEntry = function(id) {
  entries = entries.filter(e=>e.id!==id);
  localStorage.setItem(storageKey, JSON.stringify(entries));
  renderAll();
};

function drawChart() {
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");
  const ex = chartExercise.value;
  const data = entries.filter(e=>e.exercise===ex).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);

  const cssW = canvas.clientWidth || 700;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(cssW*dpr);
  canvas.height = Math.round(280*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=cssW, H=280;

  ctx.clearRect(0,0,W,H);
  ctx.font="13px -apple-system, sans-serif";
  ctx.fillStyle="#6b7280";

  if (data.length === 0) {
    ctx.textAlign="center";
    ctx.fillText("Ingen data for denne øvelse endnu",W/2,H/2);
    document.getElementById("chartSummary").textContent="";
    return;
  }

  const pad={l:42,r:14,t:18,b:42};
  const weights=data.map(d=>d.weight);
  let min=Math.min(...weights), max=Math.max(...weights);
  if (min===max) { min=Math.max(0,min-5); max=max+5; }
  else { const span=max-min; min=Math.max(0,min-span*.25); max+=span*.25; }

  const x=i => data.length===1 ? (pad.l+W-pad.r)/2 : pad.l+i*(W-pad.l-pad.r)/(data.length-1);
  const y=v => pad.t+(max-v)*(H-pad.t-pad.b)/(max-min);

  ctx.strokeStyle="#e5e7eb"; ctx.lineWidth=1;
  for(let i=0;i<5;i++){
    const yy=pad.t+i*(H-pad.t-pad.b)/4;
    ctx.beginPath(); ctx.moveTo(pad.l,yy); ctx.lineTo(W-pad.r,yy); ctx.stroke();
    const val=max-i*(max-min)/4;
    ctx.fillStyle="#6b7280"; ctx.textAlign="right";
    ctx.fillText(val.toFixed(val%1?1:0),pad.l-6,yy+4);
  }

  ctx.strokeStyle="#111827"; ctx.lineWidth=3; ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.beginPath();
  data.forEach((d,i)=>{ const xx=x(i), yy=y(d.weight); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); });
  ctx.stroke();

  data.forEach((d,i)=>{
    const xx=x(i), yy=y(d.weight);
    ctx.fillStyle="#111827"; ctx.beginPath(); ctx.arc(xx,yy,4.5,0,Math.PI*2); ctx.fill();
  });

  const labels = data.length <= 5 ? data.map((_,i)=>i) : [0, Math.floor((data.length-1)/2), data.length-1];
  ctx.fillStyle="#6b7280"; ctx.textAlign="center"; ctx.font="11px -apple-system, sans-serif";
  labels.forEach(i=>ctx.fillText(formatDate(data[i].date).slice(0,5),x(i),H-16));

  const first=data[0].weight, last=data[data.length-1].weight;
  const delta=last-first;
  document.getElementById("chartSummary").textContent =
    data.length===1 ? `Seneste vægt: ${last} kg.` :
    `Fra ${first} kg til ${last} kg (${delta>=0?"+":""}${delta.toFixed(1)} kg) over ${data.length} registreringer.`;
}

function renderAll(){
  renderExerciseList();
  renderHistory();
  drawChart();
}

document.getElementById("saveBtn").addEventListener("click",save);
chartExercise.addEventListener("change",drawChart);
window.addEventListener("resize",drawChart);

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.view).classList.add("active");
    if(btn.dataset.view==="fremskridt") setTimeout(drawChart,50);
  });
});

document.getElementById("clearBtn").addEventListener("click",()=>{
  if(confirm("Vil du slette alle registrerede træninger?")){
    entries=[];
    localStorage.removeItem(storageKey);
    renderAll();
  }
});

document.getElementById("exportBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(entries,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="styrketracker-data.json";
  a.click();
  URL.revokeObjectURL(a.href);
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

renderAll();
</script>
</body>
</html>
